<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Craft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.7);
    }
    #crosshair::before {
      width: 2px; height: 20px;
      left: -1px; top: -10px;
    }
    #crosshair::after {
      width: 20px; height: 2px;
      left: -10px; top: -1px;
    }

    #hotbar {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      z-index: 10;
      pointer-events: none;
    }
    .hotbar-slot {
      width: 50px;
      height: 50px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hotbar-slot.selected {
      border-color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.15);
    }
    .hotbar-slot .block-preview {
      width: 32px;
      height: 32px;
      border-radius: 2px;
    }
    .hotbar-slot .slot-num {
      position: absolute;
      top: 2px;
      left: 4px;
      font-family: monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
    }

    #debug {
      position: fixed;
      top: 10px;
      left: 10px;
      font-family: monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      pointer-events: none;
      z-index: 10;
      line-height: 1.5;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    #prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: monospace;
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      text-align: center;
      pointer-events: none;
      z-index: 20;
    }

    #time-display {
      position: fixed;
      top: 10px;
      right: 10px;
      font-family: monospace;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      pointer-events: none;
      z-index: 10;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="prompt">Click to play</div>
  <div id="hotbar"></div>
  <div id="debug"></div>
  <div id="time-display"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
